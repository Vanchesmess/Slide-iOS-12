name: Build Slide IPA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Dystopia API Credentials, Remove Watch/Widgets & Fix Podfile
        run: |
          find . -type f \( -name "*.swift" -o -name "*.plist" \) -exec sed -i '' 's/r1JeYb6X0P2QOg/XCCJPTbxgTaaQA/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.plist" \) -exec sed -i '' 's|slide://ccrama|dystopia://response|g' {} +
          find . -type f -name "*.swift" -exec sed -i '' 's|/u/ccrama|/u/afterxleep|g' {} +
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes: string dystopia" "Slide for Reddit/Info.plist" || true
          chmod -R 777 .

          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("Slide for Reddit.xcodeproj")
            proj.targets.each do |t|
              t.remove_from_project if t.name != "Slide for Reddit"
            end
            proj.objects.each do |obj|
              if obj.is_a?(Xcodeproj::Project::Object::PBXTargetDependency) || obj.is_a?(Xcodeproj::Project::Object::PBXContainerItemProxy)
                obj.remove_from_project
              end
            end
            proj.save
          '

          ruby -e '
            podfile = File.read("Podfile")
            podfile.gsub!(/target '\''(?!Slide for Reddit'\'').*?end\n/m, "")
            patch = "post_install do |installer|\n  installer.pods_project.targets.each do |t|\n    t.build_configurations.each do |c|\n      c.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"12.0\"\n      c.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      c.build_settings[\"GCC_TREAT_WARNINGS_AS_ERRORS\"] = \"NO\"\n      c.build_settings[\"SWIFT_TREAT_WARNINGS_AS_ERRORS\"] = \"NO\"\n    end\n  end\n"
            if podfile.include?("post_install do |installer|")
              podfile.sub!("post_install do |installer|", patch)
            else
              podfile += "\n#{patch}end\n"
            end
            File.write("Podfile", podfile)
          '

      - name: Install CocoaPods
        run: |
          pod install || pod install --repo-update

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild clean build \
            -workspace "Slide for Reddit.xcworkspace" \
            -scheme "Slide for Reddit" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED"

      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Slide for Reddit.app" -path "*/Release-iphoneos/*" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Slide_iOS12.ipa Payload
          ls -lh Slide_iOS12.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slide_iOS12
          path: Slide_iOS12.ipa
