name: Build Slide IPA for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ios12-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-12-build:
    runs-on: macos-15   # Apple Silicon, на образе только Xcode 16.x
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Patch Dystopia API Credentials, Remove Watch/Widgets & Fix Podfile
        run: |
          set -ex
          export LC_ALL=C

          find . -type f \( -name "*.swift" -o -name "*.plist" \) -not -path "./.git/*" -exec sed -i '' 's/r1JeYb6X0P2QOg/XCCJPTbxgTaaQA/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.plist" \) -not -path "./.git/*" -exec sed -i '' 's|slide://ccrama|dystopia://response|g' {} +
          find . -type f -name "*.swift" -not -path "./.git/*" -exec sed -i '' 's|/u/ccrama|/u/afterxleep|g' {} +
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes: string dystopia" "Slide for Reddit/Info.plist" || true

          ruby -e 'require "xcodeproj"' 2>/dev/null || sudo gem install xcodeproj

          cat > /tmp/fix_project.rb <<'RUBY'
          require "xcodeproj"
          proj_path = "Slide for Reddit.xcodeproj"
          proj = Xcodeproj::Project.open(proj_path)
          main = proj.targets.find { |t| t.name == "Slide for Reddit" }
          abort "Main target not found" unless main

          main.dependencies.dup.each(&:remove_from_project)
          main.build_phases.dup.each do |ph|
            if ph.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase)
              if ph.name.to_s =~ /watch|extension|plugin|clip/i ||
                 ["13", "16"].include?(ph.dst_subfolder_spec.to_s)
                ph.remove_from_project
              end
            elsif ph.is_a?(Xcodeproj::Project::Object::PBXShellScriptBuildPhase)
              ph.remove_from_project if ph.name.to_s =~ /swiftlint|reveal/i
            end
          end
          proj.targets.dup.each { |t| t.remove_from_project unless t == main }

          [proj, main].each do |o|
            o.build_configurations.each do |c|
              c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "12.0"
              c.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
            end
          end
          proj.save

          scheme = Xcodeproj::XCScheme.new
          scheme.configure_with_targets(main, nil, launch_target: true)
          scheme.save_as(proj_path, "Slide for Reddit", true)
          RUBY
          ruby /tmp/fix_project.rb

          cat > /tmp/fix_podfile.rb <<'RUBY'
          MAIN = "Slide for Reddit"
          opens  = lambda { |l| l =~ /\bdo\s*(\|[^|]*\|)?\s*(#.*)?$/ || l =~ /^\s*(if|unless|case|begin)\b/ }
          closes = lambda { |l| l =~ /^\s*end\b/ }

          out = []
          depth = 0
          File.readlines("Podfile").each do |line|
            if depth > 0
              depth += 1 if opens.call(line)
              depth -= 1 if closes.call(line)
              next
            end
            if line =~ /^\s*target\s*\(?\s*['"]([^'"]+)['"]\s*\)?\s+do\b/ && $1 != MAIN
              depth = 1
              next
            end
            out << line
          end
          podfile = out.join
          abort "Main target block not found in Podfile" unless podfile =~ /target\s*\(?\s*['"]#{MAIN}['"]/

          patch = <<~P
            post_install do |installer|
              installer.pods_project.targets.each do |t|
                t.build_configurations.each do |c|
                  c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "12.0"
                  c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  c.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                  c.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                  c.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                end
              end
          P
          if podfile.include?("post_install do |installer|")
            podfile.sub!("post_install do |installer|", patch.chomp)
          else
            podfile += "\n#{patch}end\n"
          end
          File.write("Podfile", podfile)
          RUBY
          ruby /tmp/fix_podfile.rb
          echo "----- Podfile -----"; cat Podfile
          if grep -nE "Tests|Widget|Watch|Extension" Podfile; then
            echo "WARNING: Podfile still references other targets (see lines above)"
          fi

      - name: Install CocoaPods
        run: |
          set -eo pipefail
          export COCOAPODS_DISABLE_STATS=true
          pod install --repo-update 2>&1 | tee pods.log

          XC="Pods/Target Support Files/Pods-Slide for Reddit/Pods-Slide for Reddit.release.xcconfig"
          if [ ! -f "$XC" ]; then
            echo "ERROR: xcconfig not generated"
            ls -R "Pods/Target Support Files" 2>/dev/null | head -50
            exit 1
          fi

          chmod -R u+w Pods

          cat > /tmp/fix_sdc.rb <<'RUBY'
          Dir["Pods/SDCAlertView/**/*.swift"].each do |f|
            txt = File.read(f)
            new = txt.gsub(/(?<![.\w])(?<!enum )(?<!class )(?<!struct )(?<!protocol )(?<!typealias )Transition\b/,
                           "SDCAlertView.Transition")
            File.write(f, new) if new != txt
          end
          RUBY
          ruby /tmp/fix_sdc.rb

      - name: Build unsigned app
        run: |
          set +e
          xcodebuild clean build \
            -workspace "Slide for Reddit.xcworkspace" \
            -scheme "Slide for Reddit" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          STATUS=$?
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log || true
          if [ $STATUS -ne 0 ]; then
            echo "----- last 100 lines of build.log -----"
            tail -n 100 build.log
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/Slide for Reddit.app"
          echo "Looking for app at: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!"
            exit 1
          fi
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"
          lipo -info "$APP_PATH/Slide for Reddit" || true
          rm -rf Payload Slide_iOS12.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Slide_iOS12.ipa Payload
          ls -lh Slide_iOS12.ipa

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slide-ios12
          path: |
            Slide_iOS12.ipa
            build.log
            pods.log
          if-no-files-found: warn
